# Fork of the crates.io package, see PATCHES.md. Normalized by cargo when upstream published it:
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2024"
name = "zenoh-web-rtc-srtp"
version = "0.21.0-zw.4"
authors = ["Rain Liu <yliu@webrtc.rs>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Fork of rtc-srtp 0.21.0 with fixes for zenoh-web (see PATCHES.md)"
documentation = "https://docs.rs/zenoh-web-rtc-srtp"
readme = "README.md"
keywords = [
    "sansio",
    "networking",
    "protocols",
]
categories = ["network-programming"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jeff-hykin/webrtc-rs-zenoh-web"
resolver = "2"

[features]
crypto-aws-lc-rs = ["crypto/crypto-aws-lc-rs"]
crypto-ring = ["crypto/crypto-ring"]
default = ["crypto-ring"]

[lib]
name = "rtc_srtp"
path = "src/lib.rs"

[[test]]
name = "provider_profiles"
path = "tests/provider_profiles.rs"

[dependencies.byteorder]
version = "1.5.0"

[dependencies.bytes]
version = "1.12.0"

[dependencies.crypto]
version = "0.21.0"
default-features = false
package = "rtc-crypto"

[dependencies.rtcp]
version = "0.21.0"
package = "rtc-rtcp"

[dependencies.rtp]
version = "0.21.0"
package = "rtc-rtp"

[dependencies.shared]
version = "0.21.0"
features = [
    "marshal",
    "replay",
]
default-features = false
package = "rtc-shared"

[dev-dependencies.lazy_static]
version = "1.4.0"
